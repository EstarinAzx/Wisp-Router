# Release pipeline (#67, ADR-0003): PRs and tag v* compile on four native runners;
# only matching version-tag pushes may publish after all builds pass.
# (opentui ships per-platform native libs — no cross-compiling), attach the binaries to a
# GitHub release, and publish npm `wisp-router` as a thin shell over four platform packages
# (the esbuild/biome optionalDependencies pattern). Bins: wisp + claude-wisp + codex-wisp.
name: Release

on:
  pull_request:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
            binary: wisp.exe
          - target: darwin-arm64
            os: macos-latest
            binary: wisp
          # macos-13 (the old free Intel label) retired Dec 2025 — macos-15-intel is the
          # last free x86_64 mac runner, available until Aug 2027.
          - target: darwin-x64
            os: macos-15-intel
            binary: wisp
          - target: linux-x64
            os: ubuntu-latest
            binary: wisp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      # Smoke always uses the baked package version; release tags must also match it.
      - name: Resolve and verify package version
        id: version
        shell: bash
        run: |
          PKG_VERSION=$(bun -e "console.log((await Bun.file('packages/tui/package.json').json()).version)")
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "Tag $TAG_VERSION != packages/tui version $PKG_VERSION" >&2
              exit 1
            fi
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile

      - name: Compile
        working-directory: packages/tui
        run: bun build --compile src/index.tsx --outfile dist/${{ matrix.binary }}

      # The check runs copied artifacts outside the checkout with an empty child PATH.
      # Covers both launchers, headless dispatch, and the compiled Responses door; no live Provider.
      - name: Smoke test
        working-directory: packages/tui
        run: node tests/packagedCodex.check.mjs dist/${{ matrix.binary }}

      # Hermetic local catalog fixture; actual CLI and desktop acceptance are separate gates.
      - name: Signed desktop smoke test
        working-directory: packages/tui
        shell: bash
        run: node tests/packagedDesktop.check.mjs dist/${{ matrix.binary }} - "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v6
        with:
          name: wisp-${{ matrix.target }}
          path: packages/tui/dist/${{ matrix.binary }}
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release + upload assets
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      # The VS Code extension rides the same release page (the repo keeps no vsix — *.vsix is
      # gitignored — so the release is the only copy). The companion is required: it bundles
      # the same signed Bridge, and a missing/stale VSIX must block publication.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Package the exact VS Code companion
        run: |
          VSIX_VERSION=$(node -p "require('./packages/vscode/package.json').version")
          VSIX="$GITHUB_WORKSPACE/packages/vscode/wisp-$VSIX_VERSION.vsix"
          bun run --cwd packages/vscode package --out "$VSIX"
          test -s "$VSIX"

      # Stage each platform package: drop its compiled binary into bin/ and stamp the version.
      - name: Stage platform packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for t in win32-x64 darwin-arm64 darwin-x64 linux-x64; do
            BIN=wisp; [ "$t" = "win32-x64" ] && BIN=wisp.exe
            DIR=packages/tui/npm/wisp-router-$t
            mkdir -p "$DIR/bin"
            cp "artifacts/wisp-$t/$BIN" "$DIR/bin/$BIN"
            chmod +x "$DIR/bin/$BIN"
            (cd "$DIR" && npm pkg set version="$VERSION")
          done
          # The thin shell pins every platform package to the SAME release version.
          cd packages/tui/npm/wisp-router
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = process.argv[1];
            for (const k of Object.keys(p.optionalDependencies)) p.optionalDependencies[k] = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          " "$VERSION"

      # The GitHub release goes FIRST: the npm shim's fallback downloads the binary from it,
      # so it must exist before the thin shell is installable. Skipped when it already exists
      # (re-run safety).
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — skipping"
            exit 0
          fi
          mkdir -p release
          cp artifacts/wisp-win32-x64/wisp.exe "release/wisp-v$VERSION-win32-x64.exe"
          cp artifacts/wisp-darwin-arm64/wisp "release/wisp-v$VERSION-darwin-arm64"
          cp artifacts/wisp-darwin-x64/wisp "release/wisp-v$VERSION-darwin-x64"
          cp artifacts/wisp-linux-x64/wisp "release/wisp-v$VERSION-linux-x64"
          VSIX_VERSION=$(node -p "require('./packages/vscode/package.json').version")
          VSIX="packages/vscode/wisp-$VSIX_VERSION.vsix"
          test -s "$VSIX"
          cp "$VSIX" release/
          NOTES_FILE="docs/releases/v$VERSION.md"
          test -s "$NOTES_FILE"
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "wisp-router $VERSION" \
            --notes-file "$NOTES_FILE"

      # Platform packages are BEST-EFFORT: npm's spam filter has 403'd and post-publish removed
      # them before — the shim's release-download fallback covers installs either way. The thin
      # shell itself must land, so it alone hard-fails. Already-published versions are skipped
      # (publish isn't idempotent).
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for d in wisp-router-win32-x64 wisp-router-darwin-arm64 wisp-router-darwin-x64 wisp-router-linux-x64; do
            NAME=$(node -p "require('./packages/tui/npm/$d/package.json').name")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already on npm — skipping"
            else
              (cd packages/tui/npm/$d && npm publish --access public) \
                || echo "WARN: $NAME publish failed — the shim falls back to the release download"
            fi
          done
          if npm view "wisp-router@$VERSION" version >/dev/null 2>&1; then
            echo "wisp-router@$VERSION already on npm — skipping"
          else
            (cd packages/tui/npm/wisp-router && npm publish --access public)
          fi
